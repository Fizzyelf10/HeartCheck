spring.application.name=heart-backend
server.port=8080

# URL of the Python ML service (override with env var ML_SERVICE_URL)
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.timeout-seconds=5

# Allowed CORS origins for /api/** (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}

# Gzip the website + JSON, and revalidate static files on change
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
spring.web.resources.cache.cachecontrol.no-cache=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
